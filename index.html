        /* コンテンツ内の装飾用Blob */
        .blob-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        /* 背景アニメーション用Keyframes */
        @keyframes float-morph {
            0% {
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                border-radius: 70% 30% 30% 70% / 60% 40% 60% 40%;
                transform: translate(20px, -30px) rotate(20deg);
            }

            66% {
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
                transform: translate(-20px, 20px) rotate(-10deg);
            }

            100% {
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
                transform: translate(0, 0) rotate(0deg);
            }
        }

        .animate-float-morph {
            animation: float-morph 15s ease-in-out infinite;
        }

        /* モバイルメニューのアニメーション */
        @keyframes slide-down {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-down {
            animation: slide-down 0.3s ease-out forwards;
        }

        /* コンテンツパネルスタイル */
        .solid-panel {
            background-color: #FFFFFF;
            border: 1px solid #000000;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);

            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); };
            }, []);

            const getTransform = () => {
                if (isVisible) return 'translate(0, 0)';
                if (direction === 'up') return 'translateY(20px)';
                if (direction === 'left') return 'translateX(20px)';
                if (direction === 'right') return 'translateX(-20px)';
                return 'translate(0, 0)';
            };

            return (
                <div
                    ref={ref}
                    className={`transition-all duration-700 ease-out ${className}`}
                    style={{
                        opacity: isVisible ? 1 : 0,
                        transform: getTransform(),
                        transitionDelay: `${delay}ms`,
                    }}
                >
                    {children}
                </div>
            );

                                        </div>
                                    </div>
                                </FadeIn>
                            </div>
                        </div>
                    </section>

                    {/* お知らせ */}
                    <section id="news" className="w-full max-w-[1280px] mx-auto py-16 md:py-24 px-4 md:px-9 relative z-10">
                        <FadeIn>
                            <div className="inline-block mb-12">
                                <SectionTitle title="お知らせ" borderColorClass="border-[#00989E]" />
                            </div>
                        </FadeIn>

                        {/* お知らせセクションのラッパーと装飾Blobを追加 */}
                        <div className="relative w-full flex justify-center">
                            {/* コンテンツ固定の装飾Blob */}
                            <div className="absolute top-[-60px] left-[-40px] md:left-[-60px] w-[500px] h-[500px] bg-[#00989E] opacity-20 blob-shape -z-10 rotate-6 animate-float-morph"></div>
                            <div className="absolute bottom-[-40px] right-[-30px] md:right-[-10px] w-[400px] h-[300px] bg-[#FFBD59] opacity-20 blob-shape -z-10 -rotate-12 animate-float-morph"></div>

                            <div className="flex flex-col px-0 md:px-8 max-w-[1144px] w-full mx-auto solid-panel p-8 md:p-12 bg-white/85">
                                {[1].map((item, index) => (
                                    <FadeIn key={item} delay={index * 100} direction="up">
                                        <div className="group cursor-pointer">
                                            <div className="flex flex-col py-6 transition-all duration-300 group-hover:bg-white group-hover:pl-4">
                                                <span className="font-lato font-medium text-lg text-[#535353] mb-2">2025.12.22</span>
                                                <span className="font-bold text-lg md:text-xl text-[#535353] group-hover:text-[#00989E] transition-colors">Coming soon...</span>
                                            </div>
                                            <div className="w-full h-[1px] bg-gray-300 group-hover:bg-[#00989E] transition-colors"></div>
                                        </div>
                                    </FadeIn>
                                ))}
                                {[2].map((item, index) => (
                                    <FadeIn key={item} delay={index * 100} direction="up">
                                        <div className="group cursor-pointer">
                                            <div className="flex flex-col py-6 transition-all duration-300 group-hover:bg-white group-hover:pl-4">
                                                <span className="font-lato font-medium text-lg text-[#535353] mb-2">2025.12.24</span>
                                                <span className="font-bold text-lg md:text-xl text-[#535353] group-hover:text-[#00989E] transition-colors">Coming soon...</span>
                                            </div>
                                            <div className="w-full h-[1px] bg-gray-300 group-hover:bg-[#00989E] transition-colors"></div>
                                        </div>
                                    </FadeIn>
                                ))}
                                <FadeIn delay={600} className="mt-8 text-right">
                                    <button className="text-[#00989E] font-bold border-2 border-[#00989E] bg-white px-6 py-3 rounded-full hover:bg-[#00989E] hover:text-white ">一覧を見る</button>
                                </FadeIn>
                            </div>
                        </div>
                    </section>

                    

                    {/* お問い合わせ */}
                    <section id="contact" className="w-full max-w-[1280px] mx-auto py-16 md:py-24 px-4 md:px-9 mb-12">
                        <FadeIn>
                            <div className="inline-block mb-12">
                                <SectionTitle title="お問い合わせ" borderColorClass="border-[#B9D05A]" />
                            </div>
                        </FadeIn>

                        {/* お問い合わせセクションのラッパーと装飾Blob */}
                        <div className="relative w-full flex justify-center">
                            <div className="absolute top-[-50px] left-[-50px] w-[500px] h-[500px] bg-[#B9D05A] opacity-30 blob-shape -z-10 rotate-12 animate-float-morph"></div>

                            <FadeIn delay={200} direction="up" className="w-full">
                                {/* ★変更: action属性とmethod属性を使用し、onSubmitを削除 */}
                                <div className="w-full max-w-[640px] mx-auto solid-panel p-6 md:p-12">
                                    <form action={formEndpoint} method="POST" className="flex flex-col gap-6">
                                        <div className="w-full">
                                            <div className="flex items-center gap-2 mb-2">
                                                <label className="text-lg font-jp font-medium text-[#535353]">お名前</label>
                                                <span className="text-red-500 text-xs font-bold px-2 py-0.5 bg-white border border-red-500 rounded-sm">必須</span>
                                            </div>
                                            <input
                                                type="text"
                                                name="name"
                                                required
                                                value={formData.name}
                                                onChange={handleInputChange}
                                                placeholder="例：山田 太郎"
                                                className="w-full p-4 border-2 border-gray-300 rounded-lg bg-white focus:border-[#FFBD59] focus:outline-none transition-all"
                                            />
                                        </div>
                                        <div className="w-full">
                                            <div className="flex items-center gap-2 mb-2">
                                                <label className="text-lg font-jp font-medium text-[#535353]">メールアドレス</label>
                                                <span className="text-red-500 text-xs font-bold px-2 py-0.5 bg-white border border-red-500 rounded-sm">必須</span>
                                            </div>
                                            <input
                                                type="email"
                                                name="email"
                                                required
                                                value={formData.email}
                                                onChange={handleInputChange}
                                                placeholder="example@email.com"
                                                className="w-full p-4 border-2 border-gray-300 rounded-lg bg-white focus:border-[#FFBD59] focus:outline-none transition-all"
                                            />
                                        </div>
                                        <div className="w-full">
                                            <div className="flex items-center gap-2 mb-2">
                                                <label className="text-lg font-jp font-medium text-[#535353]">件名</label>
                                                <span className="text-red-500 text-xs font-bold px-2 py-0.5 bg-white border border-red-500 rounded-sm">必須</span>
                                            </div>
                                            <input
                                                type="text"
                                                name="subject"
                                                required
                                                value={formData.subject}
                                                onChange={handleInputChange}
                                                className="w-full p-4 border-2 border-gray-300 rounded-lg bg-white focus:border-[#FFBD59] focus:outline-none transition-all"
                                            />
                                        </div>
                                        <div className="w-full">
                                            <div className="flex items-center gap-2 mb-2">
                                                <label className="text-lg font-jp font-medium text-[#535353]">内容</label>
                                                <span className="text-red-500 text-xs font-bold px-2 py-0.5 bg-white border border-red-500 rounded-sm">必須</span>
                                            </div>
                                            <textarea
                                                name="message"
                                                required
                                                value={formData.message}
                                                onChange={handleInputChange}
                                                placeholder="お問い合わせ内容をご記入ください"
                                                className="w-full h-[200px] p-4 border-2 border-gray-300 rounded-lg bg-white resize-none focus:border-[#FFBD59] focus:outline-none transition-all"
                                            ></textarea>
                                        </div>
                                        <button
                                            type="submit"
                                            className="w-full md:w-auto md:px-12 py-4 bg-[#B9D05A] text-white font-bold text-xl rounded-full border-2 border-transparent shadow-md hover:bg-white hover:text-[#B9D05A] hover:border-[#B9D05A] transition-all transform hover:-translate-y-1 mx-auto mt-6"
                                        >
                                            送信する
                                        </button>
                                    </form>
                                </div>
                            </FadeIn>
                        </div>
                    </section>

                    {/* SNS　*/}
                    <section id="sns" className="w-full max-w-[1280px] mx-auto py-8 md:py-12 px-4 md:px-9 my-6">
                        <FadeIn>
                            <div className="inline-block mb-8">
                                <SectionTitle title="SNS" />
                            </div>
                        </FadeIn>

                        <div className="relative w-full flex justify-center">
                            {/* 装飾Blob - サイズ調整 */}
                            <div className="absolute top-[-20px] left-[-20px] w-[200px] h-[200px] bg-[#FFBD59] opacity-20 blob-shape -z-10 rotate-12 animate-float-morph"></div>
                            <div className="absolute bottom-[-20px] right-[-20px] w-[150px] h-[150px] bg-[#00989E] opacity-20 blob-shape -z-10 -rotate-6 animate-float-morph"></div>

                            {/* コンテナ: 中央寄せレイアウトに変更 */}
                            <div className="solid-panel p-8 md:p-12 bg-white/95 w-fit flex justify-center">
                                {/* Gridをやめ、Flexboxで中央配置 & 幅制限(max-w)でボタンが巨大化するのを防ぐ */}
                                <div className="flex flex-row flex-wrap justify-center gap-6 md:gap-12 w-full max-w-[500px]">
                                    {SOCIAL_LINKS.map((link, index) => (
                                        <FadeIn key={index} delay={index * 100} direction="up" className="flex-1 min-w-[140px] max-w-[200px]">
                                            <a href={link.url} target="_blank" rel="noopener noreferrer" className="flex flex-col items-center justify-center py-6 px-4 bg-white border-2 border-gray-200 rounded-lg hover:border-current hover:-translate-y-1 transition-all duration-300 group shadow-sm hover:shadow-md h-full aspect-[4/3]">
                                                <div className={`w-12 h-12 flex items-center justify-center rounded-full bg-gray-50 mb-3 group-hover:bg-opacity-20 transition-colors ${link.color}`}>
                                                    {/* アイコンの平常時色を #535353 に、ホバー時を親のcolorに */}
                                                    <link.icon size={28} className={`text-[#535353] group-hover:text-current transition-colors`} />
                                                </div>
                                                <span className="font-bold text-base text-[#535353]">{link.name}</span>
                                            </a>
                                        </FadeIn>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* フッター */}
                    <footer className="w-full bg-white relative pt-10 pb-8 px-4 md:px-16 border-t border-gray-300 mt-20">
                        <div className="max-w-[1280px] mx-auto relative">
                            <div className="absolute top-[-70px] right-0 md:right-4">
                                <button onClick={scrollToTop} className="w-[50px] h-[50px] md:w-[60px] md:h-[60px] bg-[#4C8F3D] rounded-full flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(0,0,0,0.2)] hover:translate-y-1 hover:shadow-none transition-all text-white border-2 border-white">
                                    <ArrowUp size={24} strokeWidth={3} />
                                </button>
                            </div>
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-end mt-8 gap-8 md:gap-0">
                                <div className="flex flex-col md:flex-row items-start md:items-center gap-6 md:gap-8 w-full md:w-auto">
                                    <div className="w-[100px] h-[100px] md:w-[117px] md:h-[140px] bg-white rounded-none shrink-0 p-2">
                                        <img src={IMAGES.footerLogo} alt="Footer Logo" className="w-full h-full object-contain" />
                                    </div>
                                    <div className="hidden md:block h-[120px] w-[2px] bg-gray-300"></div>
                                    <div className="flex flex-col justify-center gap-2">
                                        <h3 className="font-bold text-lg md:text-xl text-[#535353] font-jp">ゆるまち委員会</h3>
                                        <p className="font-medium text-sm md:text-base text-[#535353] font-jp mt-2">〒150-0021 新潟県長岡市</p>
                                        <div className="flex items-center gap-3 mt-2">
                                            <div className="w-6 h-6 bg-[#535353] rounded-sm flex items-center justify-center text-white"><Mail size={14} /></div>
                                            <span className="font-lato font-medium text-sm md:text-base tracking-wide text-[#535353]">yurumachi.yuruyuru@gmail.com</span>
                                        </div>
                                    </div>
                                </div>
                                <nav className="flex flex-wrap md:flex-nowrap items-center gap-4 md:gap-8 w-full md:w-auto justify-center md:justify-end">
                                    <button onClick={() => scrollToSection('business')} className="font-bold text-base md:text-lg text-[#535353] hover:text-[#FFBD59] transition-colors">事業紹介</button>
                                    <button onClick={() => scrollToSection('news')} className="font-bold text-base md:text-lg text-[#535353] hover:text-[#00989E] transition-colors">お知らせ</button>
                                    <button onClick={() => scrollToSection('members')} className="font-bold text-base md:text-lg text-[#535353] hover:text-[#EF2535] transition-colors">メンバー</button>
                                    <button onClick={() => scrollToSection('contact')} className="font-bold text-base md:text-lg text-[#535353] hover:text-[#B9D05A] transition-colors">お問い合わせ</button>
                                </nav>
                            </div>
                            <div className="mt-12 text-center text-xs text-gray-400 font-lato">&copy; 2025 Yurumachi Committee. All Rights Reserved.</div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>

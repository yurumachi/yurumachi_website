<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歩み | 一般社団法人 ゆるまち委員会</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        jp: ['"Yu Gothic"', '"YuGothic"', '"Noto Sans JP"', 'sans-serif'],
                        lato: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
            color: #535353;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .blob-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        @keyframes float-morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(0, 0) rotate(0deg); }
            33% { border-radius: 70% 30% 30% 70% / 60% 40% 60% 40%; transform: translate(20px, -30px) rotate(20deg); }
            66% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translate(-20px, 20px) rotate(-10deg); }
            100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(0, 0) rotate(0deg); }
        }

        .animate-float-morph {
            animation: float-morph 15s ease-in-out infinite;
        }

        /* タイムライン用のスタイル */
        .timeline-line {
            position: absolute;
            left: 15px;
            top: 10px;
            bottom: 0;
            width: 4px;
            background-color: #FFBD59;
            z-index: 0;
        }

        .solid-panel {
            background-color: #FFFFFF;
            border: 1px solid #000000;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        }
        
        /* モバイルメニューのアニメーション */
        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down {
            animation: slide-down 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-transparent relative">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- アイコン ---
        const ArrowLeft = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        );
        const Mail = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
        );
        const ArrowUp = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>
        );
        // メニューアイコン追加
        const Menu = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>
        );
        const X = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );

        // --- 画像URL定義 (index.htmlと同じものを使用) ---
        const IMAGES = {
            logo: "./photo/yurumachi_logo.jpg",
            footerLogo: "./photo/yurumachi_logo.jpg",
        };

        // --- 背景Blobコンポーネント ---
        const BackgroundBlobs = () => {
            return (
                <div className="fixed inset-0 w-full h-full overflow-hidden -z-20 pointer-events-none bg-white">
                    <div className="absolute top-[5%] left-[5%] w-[120px] h-[120px] bg-[#EF2535] opacity-90 animate-float-morph" style={{ animationDelay: '0s', animationDuration: '20s' }}></div>
                    <div className="absolute bottom-[10%] right-[5%] w-[150px] h-[150px] bg-[#B9D05A] opacity-90 animate-float-morph" style={{ animationDelay: '-5s', animationDuration: '23s' }}></div>
                    <div className="absolute top-[45%] left-[2%] w-[100px] h-[100px] bg-[#FFBD59] opacity-90 animate-float-morph" style={{ animationDelay: '-10s', animationDuration: '25s' }}></div>
                    <div className="absolute top-[15%] right-[8%] w-[130px] h-[130px] bg-[#00989E] opacity-90 animate-float-morph" style={{ animationDelay: '-15s', animationDuration: '22s' }}></div>
                    <div className="absolute bottom-[5%] left-[30%] w-[90px] h-[90px] bg-[#EF2535] opacity-90 animate-float-morph" style={{ animationDelay: '-8s', animationDuration: '28s' }}></div>
                    <div className="absolute top-[10%] left-[40%] w-[80px] h-[80px] bg-[#B9D05A] opacity-90 animate-float-morph" style={{ animationDelay: '-3s', animationDuration: '18s' }}></div>
                    <div className="absolute top-[60%] right-[15%] w-[110px] h-[110px] bg-[#FFBD59] opacity-90 animate-float-morph" style={{ animationDelay: '-12s', animationDuration: '26s' }}></div>
                    <div className="absolute bottom-[20%] left-[10%] w-[140px] h-[140px] bg-[#00989E] opacity-90 animate-float-morph" style={{ animationDelay: '-7s', animationDuration: '24s' }}></div>
                </div>
            );
        };

        // --- フェードインアニメーション ---
        const FadeIn = ({ children, delay = 0, direction = 'up', className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); } },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); };
            }, []);

            const getTransform = () => {
                if (isVisible) return 'translate(0, 0)';
                if (direction === 'up') return 'translateY(20px)';
                return 'translate(0, 0)';
            };

            return (
                <div ref={ref} className={`transition-all duration-700 ease-out ${className}`} style={{ opacity: isVisible ? 1 : 0, transform: getTransform(), transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        // --- メインアプリ ---
        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const scrollToTop = () => {
                window.location.href = 'index.html'; // ロゴクリックでトップページへ
            };

            // 別ページ(index.html)のセクションへ遷移する関数
            const scrollToSection = (id) => {
                window.location.href = `index.html#${id}`;
                setIsMenuOpen(false);
            };

            // 歩みのデータ
            const historyEvents = [
                { 
                    year: "2023.04", 
                    title: "ゆるまち委員会 設立", 
                    description: "「長岡をもっと面白くしたい」という想いを持った学生と若手社会人が集まり、任意団体として活動を開始しました。",
                    image: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80"
                },
                { 
                    year: "2023.08", 
                    title: "第1回 学生交流イベント開催", 
                    description: "駅前交流拠点「NaDeC BASE」にて初の主催イベントを開催。50名以上の学生が参加し、熱気あふれる場となりました。",
                    image: null
                },
                { 
                    year: "2024.02", 
                    title: "法人化", 
                    description: "活動の幅を広げ、社会的信用を高めるため「一般社団法人 ゆるまち委員会」として法人登記を行いました。",
                    image: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=500&q=80"
                },
                { 
                    year: "2024.08", 
                    title: "大規模フェス「Yurumachi Fes」", 
                    description: "地域企業10社と連携し、駅前の通りを歩行者天国にして過去最大規模のイベントを実施。来場者は1,000名を超えました。",
                    image: null 
                },
                { 
                    year: "2025.04", 
                    title: "学生支援事業 本格始動", 
                    description: "学生の「やりたい」を形にするための支援プログラム、メンタリング制度を新たにスタートさせました。",
                    image: null
                },
            ];

            return (
                <div className="w-full min-h-screen bg-transparent font-sans text-[#535353] overflow-x-hidden relative pb-20">
                    <BackgroundBlobs />

                    {/* ヘッダー (サイズ変更版) */}
                    <header className="fixed top-0 w-full z-50 bg-white border-b border-gray-200 shadow-sm">
                        <div className="max-w-[1280px] mx-auto h-[80px] md:h-[114px] flex justify-between items-center px-4 md:px-8">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={scrollToTop}>
                                <div className="h-[60px] md:h-[80px] flex items-center justify-center">
                                    <img src={IMAGES.logo} alt="Header Logo" className="h-full w-auto object-contain" />
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-12 font-jp font-bold text-lg">
                                <button onClick={() => scrollToSection('business')} className="hover:text-[#B9D05A] transition-colors relative after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-[#B9D05A] hover:after:w-full after:transition-all text-[#535353]">事業紹介</button>
                                <button onClick={() => scrollToSection('news')} className="hover:text-[#00989E] transition-colors relative after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-[#00989E] hover:after:w-full after:transition-all text-[#535353]">お知らせ</button>
                                <button onClick={() => scrollToSection('members')} className="hover:text-[#EF2535] transition-colors relative after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-[#EF2535] hover:after:w-full after:transition-all text-[#535353]">メンバー</button>
                                <button onClick={() => scrollToSection('contact')} className="hover:text-[#FFBD59] transition-colors relative after:content-[''] after:absolute after:bottom-[-4px] after:left-0 after:w-0 after:h-[2px] after:bg-[#FFBD59] hover:after:w-full after:transition-all text-[#535353]">お問い合わせ</button>
                            </nav>

                            <button className="md:hidden p-2 bg-gray-100 rounded-md border border-gray-300" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                            </button>
                        </div>

                        {isMenuOpen && (
                            <div className="md:hidden absolute top-[80px] left-0 w-full bg-white border-b border-gray-200 py-4 px-4 flex flex-col gap-4 font-jp font-bold text-lg animate-slide-down shadow-lg">
                                <button onClick={() => scrollToSection('business')} className="py-2 hover:text-[#B9D05A] text-left border-b border-gray-100">事業紹介</button>
                                <button onClick={() => scrollToSection('news')} className="py-2 hover:text-[#00989E] text-left border-b border-gray-100">お知らせ</button>
                                <button onClick={() => scrollToSection('members')} className="py-2 hover:text-[#EF2535] text-left border-b border-gray-100">メンバー</button>
                                <button onClick={() => scrollToSection('contact')} className="py-2 hover:text-[#FFBD59] text-left">お問い合わせ</button>
                            </div>
                        )}
                    </header>

                    {/* スペーサーの高さ調整 */}
                    <div className="h-[80px] md:h-[114px]"></div>

                    {/* メインコンテンツ */}
                    <main className="max-w-[1000px] mx-auto px-4 md:px-8 py-16">
                        
                        {/* タイトルエリア */}
                        <FadeIn>
                            <div className="text-center mb-16">
                                <h1 className="text-3xl md:text-5xl font-bold font-jp mb-6 text-[#535353]">委員会の歩み</h1>
                                <p className="text-lg md:text-xl font-bold text-gray-500">History of Yurumachi</p>
                                <div className="w-[60px] h-[6px] bg-[#FFBD59] mx-auto mt-6 rounded-full"></div>
                            </div>
                        </FadeIn>

                        {/* タイムラインエリア */}
                        <div className="relative">
                            
                            <div className="space-y-16 relative">
                                {historyEvents.map((event, index) => (
                                    <FadeIn key={index} delay={index * 150}>
                                        <div className="flex flex-col md:flex-row gap-6 md:gap-12 relative">
                                            
                                            {/* 左側: 年月とドット (PC) */}
                                            <div className="md:w-[200px] flex-shrink-0 flex md:flex-col items-center md:items-end md:text-right relative">
                                                <div className="absolute left-[19px] md:left-auto md:right-[-31px] top-2 w-4 h-4 bg-[#FFBD59] rounded-full border-2 border-white shadow-md z-10"></div>
                                                {/* 縦線 (スマホは左、PCは中央) */}
                                                <div className="absolute left-[26px] md:left-auto md:right-[-24px] top-[24px] w-[2px] h-[calc(100%+64px)] bg-gray-200 -z-0"></div>
                                                
                                                <div className="ml-12 md:ml-0">
                                                    <span className="block font-lato font-bold text-2xl md:text-3xl text-[#FFBD59] tracking-wider">{event.year}</span>
                                                </div>
                                            </div>

                                            {/* 右側: 内容 */}
                                            <div className="flex-1 ml-12 md:ml-0 pb-8">
                                                <div className="solid-panel p-6 md:p-10 bg-white relative">
                                                    {/* 吹き出しの三角 */}
                                                    <div className="hidden md:block absolute top-6 left-[-10px] w-0 h-0 border-t-[10px] border-t-transparent border-r-[10px] border-r-black border-b-[10px] border-b-transparent"></div>
                                                    <div className="hidden md:block absolute top-6 left-[-9px] w-0 h-0 border-t-[10px] border-t-transparent border-r-[10px] border-r-white border-b-[10px] border-b-transparent"></div>

                                                    <h3 className="text-xl md:text-2xl font-bold text-[#535353] mb-4 border-b border-gray-200 pb-2">{event.title}</h3>
                                                    <p className="text-[#535353] leading-relaxed font-medium text-base md:text-lg mb-4">
                                                        {event.description}
                                                    </p>
                                                    {event.image && (
                                                        <div className="mt-4 rounded-lg overflow-hidden border border-gray-200 shadow-sm w-full h-[200px] md:h-[250px]">
                                                            <img src={event.image} alt={event.title} className="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </FadeIn>
                                ))}
                                
                                {/* 未来へのメッセージ */}
                                <FadeIn delay={800}>
                                    <div className="flex flex-col md:flex-row gap-6 md:gap-12 relative pt-8">
                                        <div className="md:w-[200px] flex-shrink-0 flex md:flex-col items-center md:items-end md:text-right relative">
                                            <div className="absolute left-[15px] md:left-auto md:right-[-35px] top-0 w-6 h-6 bg-[#00989E] rounded-full border-4 border-white shadow-md z-10 animate-pulse"></div>
                                            <div className="ml-12 md:ml-0">
                                                <span className="block font-lato font-bold text-2xl text-[#00989E]">Next...</span>
                                            </div>
                                        </div>
                                        <div className="flex-1 ml-12 md:ml-0">
                                            <p className="text-xl font-bold text-[#535353]">そして、私たちの物語は続きます。</p>
                                        </div>
                                    </div>
                                </FadeIn>
                            </div>
                        </div>

                        {/* アクションボタン */}
                        <div className="mt-24 text-center">
                            <a href="index.html#contact" className="inline-block px-10 py-4 bg-[#EF2535] text-white font-bold text-xl rounded-full border-2 border-transparent shadow-md hover:bg-white hover:text-[#EF2535] hover:border-[#EF2535] transition-all transform hover:-translate-y-1 mx-auto mt-6"
                            >
                            仲間になる・お問い合わせ
                            </a>
                        </div>

                    </main>

                    {/* フッター */}
                    <footer className="w-full bg-white relative pt-10 pb-8 px-4 md:px-16 border-t border-gray-300 mt-20">
                        <div className="max-w-[1280px] mx-auto relative">
                            <div className="absolute top-[-70px] right-0 md:right-4">
                                <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="w-[50px] h-[50px] md:w-[60px] md:h-[60px] bg-[#4C8F3D] rounded-full flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(0,0,0,0.2)] hover:translate-y-1 hover:shadow-none transition-all text-white border-2 border-white">
                                    <ArrowUp size={24} strokeWidth={3} />
                                </button>
                            </div>
                            <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                                <div className="flex flex-col md:flex-row items-center gap-6">
                                    <div className="w-[100px] bg-white p-2">
                                        <img src={IMAGES.footerLogo} alt="Footer Logo" className="w-full h-full object-contain" />
                                    </div>
                                    <div className="flex flex-col items-center md:items-start gap-1">
                                        <h3 className="font-bold text-lg text-[#535353] font-jp">一般社団法人 ゆるまち委員会</h3>
                                        <div className="flex items-center gap-2 mt-1">
                                            <Mail size={16} />
                                            <span className="font-lato text-sm text-[#535353]">yurumachi.yuruyuru@gmail.com</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-center md:text-right">
                                    <a href="index.html" className="font-bold text-[#535353] hover:text-[#00989E] transition-colors">トップページへ戻る</a>
                                </div>
                            </div>
                            <div className="mt-8 text-center text-xs text-gray-400 font-lato">&copy; 2025 Yurumachi Committee. All Rights Reserved.</div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
